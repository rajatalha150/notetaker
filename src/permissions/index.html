<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notetaker - Permissions</title>
        <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #030303;
        color: #e5e5e5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        box-sizing: border-box;
      }
      * {
        box-sizing: border-box;
      }
      .container {
        text-align: center;
        max-width: 400px;
        padding: 2.5rem 2rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 1.25rem;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
        box-shadow: 0 8px 32px rgba(220, 38, 38, 0.25);
      }
      .icon svg {
        width: 28px;
        height: 28px;
        fill: white;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 0.5rem;
      }
      p {
        color: #888;
        margin: 0 0 1.75rem;
        line-height: 1.5;
        font-size: 0.875rem;
      }
      p strong {
        color: #ccc;
      }
      button {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.625rem;
        font-size: 0.9375rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.15s ease;
        box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
      }
      button:hover {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(220, 38, 38, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        line-height: 1.5;
        min-height: 1.5rem;
      }
      .granted {
        color: #22c55e;
        font-weight: 500;
      }
      .denied {
        color: #ef4444;
        font-weight: 500;
      }
      .muted {
        color: #666;
        font-size: 0.75rem;
        margin-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.06);
        padding-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
      <h1>Microphone Access</h1>
      <p>Notetaker needs <strong>microphone access</strong> to record your voice during meetings alongside tab audio.</p>
      <button id="grant">Allow Microphone Access</button>
      <div id="status" class="status"></div>
      <div class="muted">This permission is used only for active recordings and can be revoked at any time in your browser settings.</div>
    </div>
    <script src="./permissions.ts" type="module"></script>
  </body>
</html>
